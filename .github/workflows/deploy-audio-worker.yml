name: Deploy SHAC audio gateway

on:
  workflow_dispatch:
  push:
    branches: ['r2-audio-migration']
    paths:
      - 'cloudflare/audio-worker/**'
      - '.github/workflows/deploy-audio-worker.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Cloudflare token
        id: credentials
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN is not configured; deployment is being skipped without failing the branch."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve Cloudflare account ID
        if: steps.credentials.outputs.ready == 'true'
        run: |
          set -euo pipefail
          WHOAMI="$(npx --yes wrangler@4 whoami --json)"
          ACCOUNT_ID="$(printf '%s' "$WHOAMI" | node -e '
            let data="";
            process.stdin.on("data", c => data += c);
            process.stdin.on("end", () => {
              const info = JSON.parse(data);
              const accounts = Array.isArray(info.accounts) ? info.accounts : [];
              if (accounts.length !== 1 || !accounts[0]?.id) {
                console.error(`Expected exactly one Cloudflare account, found ${accounts.length}.`);
                process.exit(2);
              }
              process.stdout.write(accounts[0].id);
            });
          ')"
          if [[ ! "$ACCOUNT_ID" =~ ^[A-Za-z0-9_-]{32}$ ]]; then
            echo "Wrangler returned an invalid Cloudflare account ID."
            exit 1
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "Resolved Cloudflare account from the API token."

      - name: Ensure R2 bucket exists
        if: steps.credentials.outputs.ready == 'true'
        run: |
          if npx --yes wrangler@4 r2 bucket info singing-hoosiers-audio >/dev/null 2>&1; then
            echo "R2 bucket already exists."
          else
            npx --yes wrangler@4 r2 bucket create singing-hoosiers-audio
          fi

      - name: Deploy audio gateway Worker
        if: steps.credentials.outputs.ready == 'true'
        run: npx --yes wrangler@4 deploy --config cloudflare/audio-worker/wrangler.jsonc

      - name: Deployment summary
        run: |
          if [[ "${{ steps.credentials.outputs.ready }}" == "true" ]]; then
            {
              echo "## Audio gateway deployment attempted"
              echo "If Wrangler deployed successfully, use the workers.dev URL from the deploy step as AUDIO_GATEWAY_URL for the GitHub Pages build."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Audio gateway is ready for credentials"
              echo "Add CLOUDFLARE_API_TOKEN as a repository Actions secret, then rerun this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
